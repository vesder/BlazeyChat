plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "8.3.1"
}

group = 'me.vesder'
version = '1.2-BETA'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven { url 'https://jitpack.io' }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.18.2-R0.1-SNAPSHOT")
    compileOnly ("com.github.MilkBowl:VaultAPI:1.7")
    compileOnly ("me.clip:placeholderapi:2.11.6")
    implementation("org.xerial:sqlite-jdbc:3.50.3.0")
    implementation("com.h2database:h2:2.4.240")
    implementation ("com.mysql:mysql-connector-j:9.4.0")
    implementation ("org.postgresql:postgresql:42.7.8")
    compileOnly ('org.projectlombok:lombok:1.18.34')
    annotationProcessor ('org.projectlombok:lombok:1.18.34')
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.20")
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')

    relocate 'org.sqlite', 'me.vesder.blazeyChat.libraries.sqlite'
    relocate 'org.h2', 'me.vesder.blazeyChat.libraries.h2'
    relocate 'com.mysql', 'me.vesder.blazeyChat.libraries.mysql'
    relocate 'org.postgresql', 'me.vesder.blazeyChat.libraries.postgresql'

    minimize()
}